<!DOCTYPE html>
<html lang="en" data-default-theme="{{ theme }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>{{ title }}</title>
    <!-- Apply the saved colour theme before first paint (no flash). -->
    <script>
        (function () {
            var d = document.documentElement;
            var pref = d.getAttribute("data-default-theme") === "dark" ? "dark" : "system";
            try { pref = JSON.parse(localStorage.getItem("mdpeek.ui.v1") || "{}").theme || pref; } catch (e) {}
            var dark = pref === "dark" || (pref === "system" && !!window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
            if (dark) d.classList.add("dark");
        })();
    </script>
    <link rel="stylesheet" href="/static/app.css">
    <link rel="icon" type="image/svg+xml" href="/static/icons/github-mark.svg">
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
            },
            startup: { typeset: false },
        };
    </script>
</head>
<body>
    <div id="root"></div>
    <noscript>mdpeek needs JavaScript to show the document.</noscript>
    <script id="mdpeek-boot" type="application/json">{{ boot }}</script>
    <script src="/static/js/highlight/highlight.min.js"></script>
    <script src="/static/js/mermaid/mermaid.min.js"></script>
    <!-- MathJax still comes from the CDN (existing behaviour, out of scope). -->
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@4.0.0/tex-mml-chtml.js"></script>
    <script type="module" src="/static/app.js"></script>
</body>
</html>
